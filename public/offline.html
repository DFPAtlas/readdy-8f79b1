<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — BuildNerve</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111827;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .offline-card {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    .offline-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 15px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
    .status-bar {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button {
      width: 100%;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #f59e0b;
      color: #111827;
    }
    .btn-primary:hover { background: #d97706; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .hint { font-size: 12px; color: #64748b; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">&#9889;</div>
    <h1>You're offline</h1>
    <p>BuildNerve works best with an internet connection. Downloaded jobs and saved drafts are still available.</p>
    <div class="status-bar">
      <span class="status-dot"></span>
      <span>No internet connection detected</span>
    </div>
    <div class="actions">
      <button class="btn-primary" onclick="location.reload()">Try again</button>
      <button class="btn-secondary" onclick="history.back()">Go back</button>
    </div>
    <p class="hint">Any unsaved work stored on this device will sync when you reconnect.</p>
  </div>
  <script>
    // Listen for online event to auto-refresh
    window.addEventListener('online', function() {
      location.reload();
    });
  </script>
</body>
</html>
